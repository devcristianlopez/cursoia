<style>

*{box-sizing:border-box}[hidden]{display:none!important}html{background:var(--ink);scroll-behavior:smooth}body{margin:0;color:var(--paper);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}a{color:var(--cyan);text-underline-offset:4px}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--lime);outline-offset:4px}button:disabled{opacity:.35;cursor:default}.skip{position:fixed;top:-80px;left:20px;z-index:20;background:var(--lime);color:var(--ink);padding:12px}.skip:focus{top:12px}

@media(min-width:1600px){.slide{min-height:calc(100svh - 146px)}}
@media(max-width:1024px){.hero-grid{grid-template-columns:1.5fr 1fr}.hero-art{min-height:270px;padding:18px}.four{grid-template-columns:repeat(2,1fr)}.toolbar-hint{display:none}.stack{gap:8px}.stack .card{padding:18px}}
